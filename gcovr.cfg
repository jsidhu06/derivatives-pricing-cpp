# Coverage report settings, shared by local runs and CI:
#
#   cmake --preset coverage && cmake --build --preset coverage && ctest --preset coverage
#   gcovr build/coverage
#
# Only the library is reported: the tests, examples and third-party code are
# left out.
root = .
filter = src/
filter = include/
# Compilers add a branch for every call that may throw; almost none are ever
# taken, and counting them would put branch coverage near 60%.
exclude-throw-branches = yes
exclude-unreachable-branches = yes
