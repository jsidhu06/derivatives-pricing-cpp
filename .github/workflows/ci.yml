name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.preset }} (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-debug, ci-release]
        compiler: [gcc-13, clang-18]
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            packages: g++-13
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel "$(nproc)"

      # One iteration of each benchmark: checks they run, not how fast (shared
      # runners are too noisy for timings).
      - name: Benchmark smoke run
        if: matrix.preset == 'ci-release'
        run: ./build/ci-release/bench/dp_bench --benchmark_min_time=1x

  thread-sanitizer:
    name: ci-tsan (clang-18)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18
      # clang-18's TSan cannot map its shadow memory with the 32 bits of mmap
      # randomisation that Ubuntu 24.04 kernels use.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/ci-tsan/_deps
          key: deps-${{ runner.os }}-tsan-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset ci-tsan
      - name: Build
        run: cmake --build --preset ci-tsan --parallel
      - name: Test
        run: ctest --preset ci-tsan --parallel "$(nproc)"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-tidy-18
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/ci-tidy/_deps
          key: deps-${{ runner.os }}-tidy-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset ci-tidy
      - name: Build (runs clang-tidy)
        run: cmake --build --preset ci-tidy --parallel

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
